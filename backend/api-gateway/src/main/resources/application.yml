server:
    port: ${SERVER_PORT}
    tomcat:
        connection-timeout: ${SERVER_TOMCAT_CONNECTION_TIMEOUT}
spring:
    config:
        import: optional:file:.env[.properties]
    application:
        name: ${SPRING_APPLICATION_NAME}
    servlet:
        multipart:
            enabled: ${SPRING_SERVLET_MULTIPART_ENABLED}
            max-file-size: ${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE}
            max-request-size: ${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE}

service:
    uri:
        users: ${SERVICE_URI_USERS}
        catalog: ${SERVICE_URI_CATALOG}
        artists: ${SERVICE_URI_ARTISTS}
        admin: ${SERVICE_URI_ADMIN}
